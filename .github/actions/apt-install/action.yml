name: apt-install
description: >
  Installs Ubuntu packages with apt-get, keeping the downloaded .deb files in
  the GitHub Actions cache so that a later run downloads only what changed.

# Why this exists: the runners fetch packages from azure.archive.ubuntu.com,
# and on some runners that mirror delivers package files at a crawl (tens of
# kB/s) while the package lists, from the same host, still arrive at
# 10 MB/s. The same job's install step then took 20 seconds on one runner and
# 26-37 minutes on another (2026-10-26), and whatever job's timeout-minutes
# was hit first was cancelled before it compiled anything: compile_2404 at 30
# minutes, compile_ubuntu_32bit at 60. A restored cache does not depend on
# the mirror at all, and the cache service is a different host.
#
# Caches made on main are visible to every branch, so PR runs start warm.

inputs:
  packages:
    description: Space-separated list of packages, as for apt-get install.
    required: true
  architectures:
    description: Extra dpkg architectures to enable first (e.g. i386).
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: apt cache key
      id: key
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        ARCHS: ${{ inputs.architectures }}
      run: |
        # One cache per package set and runner image. The image version comes
        # last, so that after a weekly image update the previous image's
        # cache is still found by prefix (restore-keys) and only the debs
        # that changed since are downloaded.
        sethash=$(printf '%s|%s' "$ARCHS" "$PACKAGES" | sha256sum | cut -c1-16)
        prefix="apt-v1-${ImageOS:-unknown}-$(uname -m)-${sethash}-"
        echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
        echo "key=${prefix}${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
        echo "dir=$HOME/apt-archives" >> "$GITHUB_OUTPUT"
    - name: restore the downloaded packages
      id: restore
      uses: actions/cache/restore@v6
      with:
        path: ~/apt-archives
        key: ${{ steps.key.outputs.key }}
        restore-keys: ${{ steps.key.outputs.prefix }}
    - name: apt-get install
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        ARCHS: ${{ inputs.architectures }}
        ARCHIVES: ${{ steps.key.outputs.dir }}
      run: |
        for a in $ARCHS; do sudo dpkg --add-architecture "$a"; done
        mkdir -p "$ARCHIVES/partial"
        # Retries: a stalled download ends in "Ign:" and is retried instead
        # of failing the install.
        APT_OPTS="-o Acquire::Retries=5 -o Dir::Cache::Archives=$ARCHIVES"
        sudo apt-get $APT_OPTS update
        sudo apt-get $APT_OPTS install -y $PACKAGES
        # Debs superseded by a newer version would otherwise pile up in the
        # cache forever.
        sudo apt-get $APT_OPTS autoclean
        sudo rm -rf "$ARCHIVES/partial" "$ARCHIVES/lock"
        sudo chown -R "$(id -u):$(id -g)" "$ARCHIVES"
        du -sh "$ARCHIVES"
    - name: save the downloaded packages
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ~/apt-archives
        key: ${{ steps.key.outputs.key }}
