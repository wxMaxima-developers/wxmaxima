name: compile_windows_arm

# Native Windows-on-Arm (aarch64) build -- PHASE 1: bring-up only.
#
# Purpose is twofold (see discussion): produce a Windows ARM64 binary AND
# exercise wxMaxima's own code on a native aarch64 toolchain, which tends to
# surface latent portability bugs (word-size/pointer assumptions, alignment,
# endianness-free but ABI-sensitive code) that the x86 builds never hit.
#
# This is deliberately a SEPARATE workflow from compile_windows.yml so that a
# broken ARM experiment can never block or corrupt the proven x86 MinGW release
# job. It builds and runs the self-contained C++ unit tests only; it does NOT
# package an installer and does NOT attach anything to a release yet. Once this
# is reliably green we add packaging (bundling the clang/wx runtime DLLs) and,
# after that, the release-attach on a Version tag -- mirroring the x86 job.
#
# Toolchain: GitHub's native "windows-11-arm" runner (GA + free for public
# repos since 2025-08) + MSYS2's CLANGARM64 environment. wxWidgets is taken
# from MSYS2's PREBUILT clang-aarch64 3.3 package rather than built from source,
# so the very first run tests our code, not a from-scratch wx build. (A static
# from-source wx build, matching the x86 installer, is a later, optional phase.)

on: [push]

permissions:
  contents: read

jobs:
  compile_windows_arm:
    name: Compile using CLANGARM64
    runs-on: windows-11-arm
    timeout-minutes: 60
    permissions:
      contents: write  # for softprops/action-gh-release to attach the ARM64 ZIP
    # MSYS2 shells emit a normal (non-fatal) message on first login; make bash
    # strict so a real error still fails the step.
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout wxMaxima
        uses: actions/checkout@v7
        with:
          fetch-depth: 15

      - name: Set up MSYS2 (CLANGARM64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          # Prebuilt clang-aarch64 toolchain + build tools + wxWidgets 3.3.
          # The wxwidgets3.3-msw package pulls in its own runtime deps, and
          # ships wx-config in the CLANGARM64 prefix so CMake's FindwxWidgets
          # resolves it without hints.
          install: >-
            git
            zip
            unzip
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-pkgconf
            mingw-w64-clang-aarch64-wxwidgets3.3-msw

      - name: Configure wxMaxima
        # No -DMAXIMA: there is no native aarch64 Windows Maxima, so we do not
        # register the Maxima-driven integration tests (they would hang waiting
        # for a CAS that never connects). WXM_UNIT_TESTS=YES still registers the
        # self-contained C++ unit tests, which need neither Maxima nor a display.
        run: |
            mkdir -p build
            cd build
            export CXXFLAGS="-Wall -Wextra"
            # -DwxWidgets_USE_STATIC=ON is REQUIRED: MSYS2's clang-aarch64 wx
            # package ships static archives (libwx_*-3.3.a), but CMake's
            # FindwxWidgets otherwise asks wx-config for a *shared* link, which
            # defines WXUSINGDLL and marks every wx symbol __declspec(dllimport).
            # Linking those dllimport references against the static archives
            # fails ("... is not an import library"). Forcing static makes
            # wx-config drop WXUSINGDLL so both sides agree -- same as the x86
            # MinGW job (-DwxWidgets_USE_STATIC=true).
            cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DWXM_UNIT_TESTS=YES -DwxWidgets_USE_STATIC=ON ..

      - name: Compile wxMaxima
        run: cmake --build build

      - name: Run unit tests
        # "unittest" label = the self-contained C++ tests. MenuHelpString and
        # ButtonWrapSizer are excluded on x86 MinGW because their standalone
        # harnesses hang there; whether that reproduces under CLANGARM64 is
        # unknown, so keep the exclusion for now and revisit once the rest is
        # green (dropping it is a one-line follow-up if they pass here).
        run: ctest --test-dir build -L unittest -E "MenuHelpString|ButtonWrapSizer" --output-on-failure

      # Diagnose a loader failure in the unit tests.
      #
      # Since 2026-07-30 three of the tests -- CellPtr, SqrtCell and ImgCell --
      # fail here with exit code 0xc0000139, STATUS_ENTRYPOINT_NOT_FOUND, in
      # under a tenth of a second, i.e. the Windows loader rejects the
      # executable before any test code runs. The other thirty pass, and a
      # commit touching nothing but documentation reproduces it, so it is the
      # toolchain rather than our code -- the same run also logged 404s while
      # fetching MSYS2 packages. STATUS_ENTRYPOINT_NOT_FOUND means a DLL loaded
      # but did not export a symbol the executable imports, so the answer is in
      # the import and export tables, and in which MSYS2 package versions are
      # installed.
      #
      # This step collects that raw material rather than trying to parse PE
      # tables in YAML, and uploads it as an artifact for offline analysis. It
      # runs only when the tests failed, never fails itself, and compares each
      # failing executable against a passing one (AFontSize) -- the difference
      # between their imports is the most likely place to find the culprit.
      - name: Collect loader diagnostics
        if: failure()
        continue-on-error: true
        run: |
            set +e
            out=arm-diagnostics
            mkdir -p "$out"
            tests=build/test/unit_tests

            # Installed package versions, so a future run can be diffed against
            # a green one. This is what the logs of an older run no longer yield.
            pacman -Q > "$out/pacman-Q.txt" 2>&1
            echo "=== MSYS2 packages: $(wc -l < "$out/pacman-Q.txt") installed"

            for t in test_CellPtr test_SqrtCell test_ImgCell test_AFontSize; do
              exe="$tests/$t.exe"
              [ -f "$exe" ] || { echo "missing: $exe"; continue; }
              echo "=== $t: running it directly to capture the loader's complaint"
              "$exe" > "$out/$t.run.txt" 2>&1
              echo "$t exit=$?" | tee -a "$out/exit-codes.txt"
              ldd "$exe"       > "$out/$t.ldd.txt"     2>&1
              objdump -p "$exe" > "$out/$t.objdump.txt" 2>&1
              # Just the imported DLL names, so the sets can be diffed by eye.
              grep -i 'DLL Name:' "$out/$t.objdump.txt" | sort -u \
                  > "$out/$t.dlls.txt"
            done

            echo "=== DLLs imported by the failing CellPtr but not by the passing AFontSize"
            diff "$out/test_AFontSize.dlls.txt" "$out/test_CellPtr.dlls.txt"

            # Export tables of every DLL the failing executable resolves inside
            # the MSYS2 tree: the missing entry point has to be absent from one
            # of these.
            ldd "$tests/test_CellPtr.exe" | awk '{print $3}' \
                | grep -iE '/clangarm64/bin/' | sort -u \
                | while read -r dll; do
                    objdump -p "$dll" > "$out/dll-$(basename "$dll").txt" 2>&1
                  done
            ls -l "$out"
            exit 0

      - name: Upload loader diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: wxmaxima-windows-arm64-loader-diagnostics
          path: arm-diagnostics
          if-no-files-found: warn

      # --- PHASE 2a: portable ZIP -------------------------------------------
      # Produce a self-contained ZIP and upload it as a workflow artifact so its
      # completeness can be verified (downloaded + inspected) BEFORE anything is
      # attached to a release. wxWidgets is linked statically, so the only DLLs
      # to ship are the clang C++ runtime (libc++, libunwind), winpthread, and
      # any dynamic dependencies of wx's static libs (zlib/png/jpeg/expat/...).
      # We do not hand-maintain that list: ldd reports the exe's full transitive
      # DLL closure, and we bundle every entry that resolves inside the MSYS2
      # CLANGARM64 tree (i.e. not a Windows system DLL). These are exactly the
      # DLLs the unit-test exes already loaded successfully in the step above.
      - name: Stage runtime dependencies
        run: |
            set -euo pipefail
            exe=build/src/wxmaxima.exe
            echo "=== ldd $exe ==="
            ldd "$exe"
            stagedir=dist/wxmaxima
            mkdir -p "$stagedir"
            cp "$exe" "$stagedir/"
            # Bundle every dependency resolving under the CLANGARM64 prefix. ldd
            # is transitive, so one pass over the exe captures the whole closure.
            ldd "$exe" | awk '{print $3}' | grep -iE '/clangarm64/bin/' | sort -u | while read -r dll; do
              cp -v "$dll" "$stagedir/"
            done
            echo "=== staged payload ==="
            ls -l "$stagedir"

      - name: Create portable ZIP
        run: |
            set -euo pipefail
            ver=$(grep -oiE 'VERSION[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' || echo dev)
            zipname="wxmaxima-${ver}-windows-arm64-portable.zip"
            echo "ZIP_NAME=$zipname" >> "$GITHUB_ENV"
            ( cd dist && zip -r "../$zipname" wxmaxima )
            echo "=== zip contents ==="
            unzip -l "$zipname"

      - name: Upload portable ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: wxmaxima-windows-arm64-portable
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Attach portable ZIP to the release
        # Only on a Version tag, and only after build + unit tests + packaging
        # have all succeeded (this is the last step), so a failure never
        # publishes a broken ARM64 asset. Attaches just this one file: the
        # Windows x86 job owns the release name and body, and
        # softprops/action-gh-release merges files from every job onto the same
        # release without overwriting those -- exactly as the Ubuntu/macOS jobs
        # do (they also attach files only). The distinct
        # wxmaxima-<ver>-windows-arm64-portable.zip name cannot collide with the
        # x86 job's *.exe installer.
        if: startsWith(github.ref, 'refs/tags/Version')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
