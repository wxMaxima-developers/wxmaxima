name: compile_cygwin

on: [push]

# A newer push to the same branch makes a still-running build of the old
# commit pointless, so cancel it rather than let it hold a runner. Never for
# tags: a release build must always finish (on release day the queue held
# 86 runs and the tag builds waited about three hours).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read


jobs:
  setup_cygwin:
    runs-on: windows-2022
    steps:
      # Runs before setup_cygwin on purpose: cygwin-install-action puts its own
      # git.exe ahead of the native one on PATH, and that git refuses this
      # checkout with "detected dubious ownership" (a safe.directory check that
      # Cygwin's POSIX ownership emulation trips on Windows runners) -- checking
      # out first, while the runner's native git is still the one on PATH,
      # avoids the whole problem instead of adding a safe.directory exception.
      - name: Checkout_git
        uses: actions/checkout@v7
        with:
          # We must fetch at least the immediate parents so that if this is
          # a pull request then we can checkout the head.
          fetch-depth: 15
          path: wxmaxima
      - name: setup_cygwin
        uses: cygwin/cygwin-install-action@v6
        with:
          packages: cmake git libwx_baseu3.2-devel libwx_gtk3u3.2-devel gcc-core gcc-g++ make gettext-devel
      # Both steps run in Cygwin's own bash, as cygwin-install-action
      # recommends, rather than in the runner's default PowerShell, with
      # stdin closed. Started from PowerShell, cmake now and then hung in
      # find_package(wxWidgets) (right after "Looking for wxWidgets libraries
      # in:") until the run was cancelled or hit GitHub's 6-hour limit,
      # holding a Windows runner all that time. Why it hung isn't known; the
      # timeouts make sure a hang shows up as a failure instead.
      - name: configure
        shell: bash --noprofile --norc -eo pipefail -o igncr '{0}'
        timeout-minutes: 20
        run: |
             export PATH=/usr/local/bin:/usr/bin:$PATH
             mkdir build
             cd build
             set +e
             run_bg() {  # name, seconds, command...: run with a watchdog
               local name=$1 secs=$2; shift 2
               "$@" < /dev/null > ../$name.txt 2>&1 &
               local pid=$! i
               for i in $(seq 1 $secs); do sleep 1; kill -0 $pid 2>/dev/null || break; done
               if kill -0 $pid 2>/dev/null; then echo "=== $name: HUNG"; kill -9 $pid; else wait $pid; echo "=== $name: rc=$?"; fi
               tail -n 25 ../$name.txt
             }
             mk() {  # name, count, execute_process arguments
               local name=$1 n=$2; shift 2
               printf 'foreach(i RANGE 1 %s)\n  execute_process(COMMAND %s RESULT_VARIABLE r)\n  message("%s ${i} rc=${r}")\nendforeach()\n' "$n" "$*" "$name" > ../$name.cmake
               run_bg $name 40 cmake -P ../$name.cmake
             }
             cygcheck -c cygwin cmake 2>&1 | tail -n 2
             mk true-x40 40 sh -c true
             mk sel-x40 40 sh /usr/bin/wx-config-3.2 --selected-config OUTPUT_VARIABLE o
             set -e
             cmake ../wxmaxima < /dev/null
      - name: compile
        shell: bash --noprofile --norc -eo pipefail -o igncr '{0}'
        timeout-minutes: 120
        run: |
             export PATH=/usr/local/bin:/usr/bin:$PATH
             cd build
             make VERBOSE=1 -j 4 < /dev/null
