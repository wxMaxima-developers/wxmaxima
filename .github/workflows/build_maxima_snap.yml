name: build_maxima_snap

# Rebuilds and publishes the *Maxima* snap, to both the edge and stable channels.
#
# The wxMaxima snap embeds Maxima via `stage-snaps: [maxima]`, i.e. it pulls a
# pre-built Maxima snap from the store at build time -- it never rebuilds Maxima
# itself. The Maxima snap is defined in the Maxima source tree
# (snap/snapcraft.yaml, hosted on SourceForge), which has no CI of its own, so
# nothing rebuilt it on a schedule: it drifted to an old Maxima version and, more
# importantly, stopped picking up security fixes from the core24 runtime and the
# staged packages.
#
# This job closes that gap. Once a week it rebuilds the Maxima snap from Maxima's
# own snapcraft.yaml so the bundled libraries and base get refreshed, in two
# variants:
#   * stable <- the latest Maxima *release* tag (X.Y.Z)
#   * edge   <- the current development HEAD (Maxima releases infrequently, so
#               edge lets users get newer Maxima between releases)
# It runs on Saturday, ahead of the wxMaxima stable (Sunday) and edge (Monday)
# snap jobs, so those rebuilds bundle this fresh Maxima.
#
# Each channel is built for both amd64 and arm64 on native runners (arm64 uses
# GitHub's ubuntu-24.04-arm runners, free for public repositories), so the store
# serves a matching Maxima snap to users of either architecture. arm64 wxMaxima
# snaps stage-snap the arm64 Maxima, so this must publish before them.
#
# The Maxima snapcraft.yaml hard-codes a stale `version:`; the real version lives
# in configure.ac (AC_INIT([maxima], [X.Y.Z])) and is patched in at build time
# (with a +git<sha> suffix on edge so each development build is distinguishable).
#
# Publishing uses the SNAPCRAFT_STORE_CREDENTIALS repository secret (the same one
# the wxMaxima snap jobs use; its ACLs must allow package_push/package_release on
# the maxima snap).

on:
  workflow_dispatch:
  schedule:
    # Every Saturday at 04:00 UTC.
    - cron: '0 4 * * 6'

permissions:
  contents: read

jobs:
  build_maxima_snap:
    name: Build and publish the Maxima snap (${{ matrix.channel }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, edge]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      # No actions/checkout: this job builds Maxima, not wxMaxima. Clone the
      # Maxima source (which carries its own snap/snapcraft.yaml) into the empty
      # workspace root so snapcore/action-build finds snap/snapcraft.yaml there.
      - name: Clone Maxima and select the ref for this channel
        run: |
          set -eu
          git clone https://git.code.sf.net/p/maxima/code .
          if [ "${{ matrix.channel }}" = stable ]; then
            # Maxima release tags are plain X.Y.Z; the release-candidate tags
            # look like "version-59399rc4" and must not be selected.
            ref=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
            test -n "$ref"
            echo "Building Maxima release $ref for the stable channel"
            git checkout --quiet "$ref"
          else
            echo "Building Maxima development HEAD ($(git rev-parse --short HEAD)) for the edge channel"
          fi

      - name: Patch the snap version to the real Maxima version
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          set -eu
          python3 - <<'PY'
          import os, re, subprocess
          base = ""
          with open("configure.ac") as f:
              for line in f:
                  # Capture the whole version token, not just digits+dots:
                  # Maxima's development HEAD uses a suffix, e.g.
                  # AC_INIT([maxima], [5.49post]), which a [0-9.]+ pattern
                  # can't match -> the edge build failed to read the version.
                  m = re.search(r'AC_INIT\(\[maxima\],\s*\[([^\]]+)\]', line)
                  if m:
                      base = m.group(1)
                      break
          assert base, "could not read the Maxima version from configure.ac"
          if os.environ["CHANNEL"] == "edge":
              sha = subprocess.check_output(
                  ["git", "rev-parse", "--short", "HEAD"]).decode().strip()
              ver = "%s+git%s" % (base, sha)   # e.g. 5.49.0+gita1b2c3d
          else:
              ver = base                        # e.g. 5.49.0
          ver = ver[:32]                        # snap version limit
          p = "snap/snapcraft.yaml"
          s = open(p).read()
          s = re.sub(r'(?m)^version:.*', "version: '%s'" % ver, s)
          open(p, "w").write(s)
          print("Maxima snap version set to", ver)
          PY

      # Maxima renamed its desktop launcher (maxima commit 181c06a5b,
      # "Updates the name of the desktop launcher file for Xmaxima") -- it now
      # installs desktopintegration/Xmaxima.desktop as
      # usr/share/applications/Xmaxima.desktop. But Maxima's snap/snapcraft.yaml
      # still points the xmaxima app's `desktop:` key at the old
      # net.sourceforge.maxima.xmaxima.desktop, so snapcraft fails because that
      # file no longer exists in the prime tree. The rename is already in the
      # 5.49.0 release, so both channels are affected.
      #
      # Point `desktop:` at whatever .desktop file this Maxima ref actually
      # installs (so it stays correct for older refs too). Drop this step once
      # Maxima's own snapcraft.yaml is fixed upstream.
      - name: Work around Maxima's stale desktop-file path in snapcraft.yaml
        run: |
          set -eu
          desktop_src=$(ls desktopintegration/*.desktop 2>/dev/null | head -n1 || true)
          if [ -z "$desktop_src" ]; then
            echo "No .desktop file under desktopintegration/; leaving snapcraft.yaml unchanged."
            exit 0
          fi
          desktop_file=$(basename "$desktop_src")
          sed -i -E \
            "s#^([[:space:]]*desktop:[[:space:]]*usr/share/applications/).*#\1${desktop_file}#" \
            snap/snapcraft.yaml
          echo "Patched the xmaxima app's desktop: entry to $desktop_file"
          grep -n 'desktop:' snap/snapcraft.yaml

      # The renamed Xmaxima.desktop says `Icon=xmaxima`, a theme icon name, but
      # Maxima installs xmaxima.svg/.png flat into usr/share/icons/, not into
      # the hicolor theme snapcraft searches. snapcraft therefore cannot turn
      # the name into a ${SNAP}/... path, and the store rejects every upload
      # after its review ("Issues while processing snap: nonexistent icon
      # path") -- which is what kept this job red from 2026-09-26 on (seen in
      # the logs of 2026-10-31; the older logs had already expired).
      #
      # Giving the snap a top-level `icon:` fixes both ends: snapcraft copies
      # it to meta/gui/ and points every app's desktop file at that copy, and
      # the store listing gets an icon too. The path is relative to the Maxima
      # source tree. Drop this step once Maxima's own snapcraft.yaml sets one.
      - name: Give the snap an icon that exists
        run: |
          set -eu
          if grep -q '^icon:' snap/snapcraft.yaml; then
            echo "snapcraft.yaml already sets an icon; leaving it alone."
            exit 0
          fi
          icon=$(ls interfaces/xmaxima/xmaxima.svg interfaces/xmaxima/net.sourceforge.maxima.svg 2>/dev/null | head -n1 || true)
          if [ -z "$icon" ]; then
            echo "::error::found no xmaxima icon in the Maxima source tree"
            exit 1
          fi
          # Top-level key, so it goes right below `version:`.
          sed -i -E "s#^(version:.*)#\1\nicon: ${icon}#" snap/snapcraft.yaml
          grep -n -E '^(version|icon):' snap/snapcraft.yaml

      - name: Build the Maxima snap
        uses: snapcore/action-build@v1
        id: build

      # Catch what the store's review would reject *before* uploading, so a
      # broken icon shows up as a failed build step instead of an upload error
      # after a 10-minute build -- and so a run on a branch, which does not
      # publish, can still tell whether the snap would be accepted.
      - name: Check that every desktop file's icon is in the snap
        env:
          SNAP_FILE: ${{ steps.build.outputs.snap }}
        run: |
          set -eu
          command -v unsquashfs >/dev/null || sudo apt-get install -y -q squashfs-tools
          unsquashfs -q -d snap-meta "$SNAP_FILE" 'meta/*'
          unsquashfs -l "$SNAP_FILE" | sed 's#^squashfs-root##' > snap-files.txt
          bad=0
          for desktop in snap-meta/meta/gui/*.desktop; do
            [ -e "$desktop" ] || continue
            grep -E '^Icon=' "$desktop" | while IFS= read -r line; do
              icon=${line#Icon=}
              case "$icon" in
                '${SNAP}'/*)
                  path=${icon#'${SNAP}'}
                  if grep -qxF "$path" snap-files.txt; then
                    echo "$(basename "$desktop"): $icon is in the snap"
                  else
                    echo "::error::$(basename "$desktop"): $icon is not in the snap"
                    exit 1
                  fi;;
                *)
                  echo "::error::$(basename "$desktop"): Icon=$icon is no \${SNAP} path; the store rejects it as a nonexistent icon path"
                  exit 1;;
              esac
            done || bad=1
          done
          exit $bad

      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: maxima-snap-${{ matrix.channel }}-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error

      # Skipped on forks, so the build-only run keeps working without
      # credentials, and on any branch but main: a manual run on a feature
      # branch is a dry run that builds and checks the snap without putting
      # an unreviewed workflow's output into the store.
      - name: Publish to the ${{ matrix.channel }} channel
        if: github.repository == 'wxMaxima-developers/wxmaxima' && github.ref == 'refs/heads/main'
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ matrix.channel }}
