# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# Find more information at:
# https://github.com/microsoft/msvc-code-analysis-action

name: Microsoft C++ Code Analysis

on:
 push:
   branches: [ "main" ]
 pull_request:
   branches: [ "main" ]
 schedule:
   - cron: '43 4 * * 6'

# A newer push to the same branch makes a still-running build of the old
# commit pointless, so cancel it rather than let it hold a runner. Never for
# tags: a release build must always finish (on release day the queue held
# 86 runs and the tag builds waited about three hours).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  build: '${{ github.workspace }}/build'
  config: Debug
  WXVERSION: 3.3.4

permissions:
  contents: read

jobs:
  analyze:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Analyze
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Cache wxWidgets
        uses: actions/cache@v6
        env:
          cache-name: cache-wxWidgets
        with:
          path: wxwidgets-source
          # ${{ env.WXVERSION }}, not PowerShell's ${env:WXVERSION}: a key is not
          # run by a shell, so the latter stayed literal text and a version bump
          # restored the previous version's build from this version-less path.
          key: ${{ runner.os }}-build-msvc-${{ env.cache-name }}-${{ env.WXVERSION }}-0
      - name: wxWidgets
        run: |
             if (Test-Path wxwidgets-source) { echo "wxWidgets already present"} else {
                 echo "Downloading wxWidgets"
                 curl "https://github.com/wxWidgets/wxWidgets/releases/download/v${env:WXVERSION}/wxWidgets-${env:WXVERSION}.7z" -L --output wxWidgets.7z
                 echo "Unpacking wxWidgets sources"
                 7z x "wxWidgets.7z" "-owxwidgets-source" -y
                 echo "Building wxWidgets from sources"
                 cd "wxwidgets-source"
                 cmake "." -DwxUSE_WEBVIEW_EDGE=true
                 cmake --build .
                 cd .. }
      - name: Configure wxMaxima
        run: |
             mkdir build
             cd build
             cmake -DwxWidgets_ROOT_DIR="../wxwidgets-source" -DwxWidgets_LIB_DIR="../wxwidgets-source/lib/vc_x64_dll" -DwxWidgets_CONFIGURATION="mswud" -DCMAKE_BUILD_TYPE=${{ env.config}} ..
             cd ..
      - name: Compile wxMaxima
        run: |
             cd build
             cmake --build .
             cd ..
      - name: Initialize MSVC Code Analysis
        uses: microsoft/msvc-code-analysis-action@v0.1.1
        # Provide a unique ID to access the sarif output path
        id: run-analysis
        with:
          cmakeBuildDirectory: ${{ env.build }}
          buildConfiguration: ${{ env.config }}
          # Ruleset file that will determine what checks will be run
          ruleset: NativeRecommendedRules.ruleset
      # Upload SARIF file to GitHub Code Scanning Alerts
      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.run-analysis.outputs.sarif }}
      # The code scanning alerts are only visible to people with access to the
      # repository's Security tab. Print the findings here as well, so that
      # anyone (or any tool) that can read the job log can work on them:
      # first a count per check, then every finding as file(line): check message.
      - name: List the findings
        # Only a report: never fail the job over it.
        continue-on-error: true
        shell: pwsh
        env:
          SARIF: ${{ steps.run-analysis.outputs.sarif }}
        run: |
             $sarif = Get-Content -Raw $env:SARIF | ConvertFrom-Json
             $root = (Get-Location).Path.Replace('\', '/') + '/'
             $findings = foreach ($run in $sarif.runs) {
               foreach ($r in $run.results) {
                 $loc = $r.locations[0].physicalLocation
                 $file = [uri]::UnescapeDataString($loc.artifactLocation.uri) -replace '^file:///', ''
                 $file = $file.Replace('\', '/').Replace($root, '')
                 [pscustomobject]@{
                   Rule = $r.ruleId
                   Where = "$file($($loc.region.startLine))"
                   Text = $r.message.text
                 }
               }
             }
             # A header included from several sources is reported once per source.
             $findings = $findings | Sort-Object Where, Rule, Text -Unique
             Write-Output "$(@($findings).Count) findings"
             $findings | Group-Object Rule | Sort-Object Count -Descending |
               ForEach-Object { '{0,6} {1}' -f $_.Count, $_.Name }
             Write-Output ''
             $findings | ForEach-Object { "$($_.Where): $($_.Rule) $($_.Text)" }
      - name: Upload the SARIF file
        uses: actions/upload-artifact@v7
        with:
          name: prefast-sarif
          path: ${{ steps.run-analysis.outputs.sarif }}
