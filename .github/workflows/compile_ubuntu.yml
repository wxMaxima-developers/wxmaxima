name: compile_ubuntu

on: [push]

env:
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  check_translations_not_wiped:
    # Guards against a failure mode that has hit this repo's translations
    # twice now (see AGENTS.md's translations section): a Crowdin export
    # branch forked before a translation-restoring commit landed, which then
    # silently blanks those strings back to empty the next time it's merged
    # -- 464 translations wiped each time, caught by hand both times. A
    # standalone job (not a step inside the build jobs) so it runs once, in
    # seconds, without needing any of the build dependencies those jobs
    # install -- it's pure git + Python.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout_git
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: check-translations-not-wiped
        run: |
             git fetch --depth=1 origin main
             pip install --quiet polib
             python3 locales/wxMaxima/check_translations_not_wiped.py origin/main

  compile_latest_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write  # for softprops/action-gh-release to attach the .deb to a release

    steps:
      - name: Checkout_git
        uses: actions/checkout@v7
        with:
          # We must fetch at least the immediate parents so that if this is
          # a pull request then we can checkout the head.
          fetch-depth: 15
      - name: install_packages
        run: |
             sudo apt-get update
             sudo apt-get install appstream appstream-util cmake desktop-file-utils doxygen gettext gnuplot gnuplot-x11 graphviz libwxgtk3.2-dev libwxgtk-webview3.2-dev libfribidi-dev maxima maxima-share maxima-doc netcat-openbsd ninja-build pandoc xvfb at-spi2-core dbus dpkg-dev po4a rpmlint lintian weston rpm tidy
      - name: validate_appdata
        # Release-blocker gate, previously a manual checklist step: a malformed
        # appdata file breaks the flatpak/appImage/appstream builders. Catch it
        # in CI on every push instead of discovering it at release time.
        run: |
             appstream-util validate data/io.github.wxmaxima_developers.wxMaxima.appdata.xml
      - name: configure
        run: |
             export CXXFLAGS="-Wall -Wextra -ansi -Werror -Wpedantic"
             export LANG=en_US.UTF-8
             mkdir build
             touch build build/build.ninja
             cd build
             cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Debug -DWXM_UNIT_TESTS=YES ..
             cd ..
      - name: compile
        run: |
             cd build
             cmake --build .
             cd ..
      - name: git-diff
        # run git diff to see, if the configure/build process has changed the source files (po4a can do that)
        run: git diff --compact-summary
      - name: cat_german_translation
        # output the german translation - how does it look like on Ubuntu 24.04?
        run: cat build/info/wxmaxima.de.md
      - name: update-locale
        run: |
             cd build
             cmake --build . --target update-locale
             cd ..
      - name: check-pot-up-to-date
        # GH #1681: wxMaxima.pot isn't regenerated by a normal build (only the
        # update-locale target above does that, and nothing pulls it in
        # automatically), so it silently drifted out of sync with the actual
        # UI strings for a long time before anyone noticed -- about 1100
        # strings' worth once caught (see AGENTS.md). update-locale writes its
        # regenerated wxMaxima.pot straight into the source tree, so by this
        # point the working copy already holds a fresh one; a plain git diff
        # against it would be useless as a staleness check on its own, though,
        # since re-running xgettext changes the POT-Creation-Date timestamp
        # and shifts every #: source-line-number reference even when zero
        # translatable strings actually changed (confirmed directly: two
        # back-to-back regenerations with no source changes between them
        # still produce a few thousand lines of diff, all of it exactly these
        # two kinds of churn). Strip both before comparing, so this only ever
        # fails on a genuine change to what's translatable.
        run: |
             strip_pot() { grep -Ev '^#: |^"POT-Creation-Date:' "$1"; }
             if ! diff -q <(strip_pot <(git show HEAD:locales/wxMaxima/wxMaxima.pot)) \
                          <(strip_pot locales/wxMaxima/wxMaxima.pot) > /dev/null; then
               echo "::error::locales/wxMaxima/wxMaxima.pot is out of date. Run 'cmake --build build --target update-locale' locally and commit the result."
               diff <(strip_pot <(git show HEAD:locales/wxMaxima/wxMaxima.pot)) \
                    <(strip_pot locales/wxMaxima/wxMaxima.pot) | head -100
               exit 1
             fi
      - name: run_tests
        run: |
             cd build
             export HOME=`pwd`
             export CTEST_OUTPUT_ON_FAILURE=1
             # multithreadtest is excluded: on ubuntu-latest Maxima's draw package
             # fails to build its native helper ("loadfile: failed to load
             # draw.lisp" / "Your C compiler failed to compile the intermediate
             # file") when several Maxima instances start at once -- an environment
             # problem we cannot fix here. The sanitizer job already excludes it.
             # dbus-run-session: without a session bus every GTK process waits
             # out the AT-SPI accessibility bridge's 25 s D-Bus timeout at
             # startup - ~90 GUI tests each stalled ~25 s (two thirds of the
             # total test time). A real bus makes registration instant (and
             # actually enables the at-spi2-core installed above).
             GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a ctest -j 2 -E "multithreadtest"
             ls -la test/test_userdirs  # check for issue #2110.
             cd ..
      - name: Package .deb (release only)
        # A separate Release-mode build, kept out of the Debug build/ above
        # (used for testing) so packaging never touches its build type or
        # flags. Only runs on a release tag, since it doubles the build time.
        # "-B _CPack_DEB" mirrors test/check-lintian.sh.in's proven invocation.
        if: startsWith(github.ref, 'refs/tags/Version')
        run: |
             mkdir build-release
             cd build-release
             cmake -G Ninja -DCMAKE_BUILD_TYPE=Release ..
             cmake --build .
             cpack -G DEB -B _CPack_DEB
             # CPack's default .deb name doesn't encode which Ubuntu release
             # it was built on, and compile_2204 (below) would otherwise
             # produce an identically-named file - rename so both can attach
             # to the same GitHub release without colliding.
             mv _CPack_DEB/*.deb wxmaxima-ubuntu-latest-amd64.deb
             cd ..
      - name: Package source tarball + checksum (release only)
        # GH #1192: a .tar.xz source archive plus a sha256 checksum for it.
        # xz compresses noticeably tighter than GitHub's own auto-generated
        # tag archives (which use plain gzip) - real bandwidth for the distro
        # packagers who mirror/rebuild from upstream source tarballs at scale
        # (the issue's original report: ~40% smaller for the same release).
        # Built with "git archive" from the tagged commit rather than reusing
        # GitHub's own "Source code" assets: those are documented to not be
        # guaranteed byte-stable over time (GitHub can silently regenerate
        # them), which is exactly why a distro packager pinning a sha256
        # against one can't fully trust it to stay valid - a checksum we
        # generate and attach ourselves, once, doesn't have that problem.
        if: startsWith(github.ref, 'refs/tags/Version')
        run: |
             VERSION="${GITHUB_REF_NAME#Version-}"
             git archive --prefix="wxmaxima-${VERSION}/" -o "wxmaxima-${VERSION}.tar" HEAD
             xz -9 "wxmaxima-${VERSION}.tar"
             mv "wxmaxima-${VERSION}.tar.xz" build-release/
             # sha256sum records whatever path it's given; strip the
             # "build-release/" build-directory prefix so the checksum file
             # verifies correctly once someone has both files side by side
             # in the same (arbitrary) local directory after downloading.
             ( cd build-release && sha256sum "wxmaxima-${VERSION}.tar.xz" > "wxmaxima-${VERSION}.tar.xz.sha256" )
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/Version')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          files: |
            build-release/*.deb
            build-release/*.tar.xz
            build-release/*.tar.xz.sha256
          draft: false
          prerelease: false

  compile_and_test_sanitized:
    # Builds with AddressSanitizer + UndefinedBehaviorSanitizer and runs the
    # test suite. Memory errors (use-after-free, buffer overflows) abort the
    # affected test and turn the job red; undefined-behavior findings are
    # printed to the log and reported as a warning annotation, but do not
    # fail the job (yet).
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout_git
        uses: actions/checkout@v7
        with:
          # We must fetch at least the immediate parents so that if this is
          # a pull request then we can checkout the head.
          fetch-depth: 15
      - name: install_packages
        run: |
             sudo apt-get update
             sudo apt-get install appstream cmake desktop-file-utils gettext gnuplot gnuplot-x11 libwxgtk3.2-dev libwxgtk-webview3.2-dev libfribidi-dev maxima maxima-share maxima-doc netcat-openbsd ninja-build pandoc po4a xvfb at-spi2-core dbus tidy
      - name: configure
        run: |
             export LANG=en_US.UTF-8
             mkdir build
             cd build
             cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Debug -DWXM_UNIT_TESTS=YES -DWXM_SANITIZE=address,undefined ..
      - name: compile
        run: cmake --build build
      - name: run_tests
        run: |
             cd build
             export HOME=`pwd`
             export CTEST_OUTPUT_ON_FAILURE=1
             # detect_leaks=0: GTK/Pango/Fontconfig leak reports would drown
             # out wxMaxima's own. Enabling leak detection with a suppression
             # file is a later step of the stability initiative.
             # suppressions: silences findings inside third-party libraries we
             # cannot fix (currently wxWidgets' XPM decoder doing an overlapping
             # strncpy); scoped per-library so our own code is still checked.
             export ASAN_OPTIONS=detect_leaks=0:check_initialization_order=1:strict_string_checks=1:suppressions=$GITHUB_WORKSPACE/test/asan_suppressions.txt
             export UBSAN_OPTIONS=print_stacktrace=1
             # Same exclusions as the regular test job (draw-based tests fail
             # on ubuntu-latest for unrelated reasons).
             # dbus-run-session: see the regular test job - avoids the 25 s
             # AT-SPI D-Bus timeout every GUI process otherwise pays at startup.
             GDK_BACKEND=x11 dbus-run-session -- xvfb-run -a ctest -j 2 -E "tutorial_fittingEquations|multithreadtest|tutorial_toleranceCalculations|tutorial_displaying3DCurves|tutorial_solvingEquations|testbench_simple.wxmx"
      - name: report_ubsan_findings
        if: always()
        run: |
             if grep -n "runtime error:" build/Testing/Temporary/LastTest.log; then
               echo "::warning::UndefinedBehaviorSanitizer reported issues (grep the run_tests log for 'runtime error:'). These do not fail CI yet."
             else
               echo "No UndefinedBehaviorSanitizer findings."
             fi

  compile_without_webview:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout_git
        uses: actions/checkout@v7
        with:
          # We must fetch at least the immediate parents so that if this is
          # a pull request then we can checkout the head.
          fetch-depth: 15
      - name: install_packages
        run: |
             sudo apt-get update
             sudo apt-get install appstream cmake desktop-file-utils doxygen gettext gnuplot gnuplot-x11 graphviz libwxgtk3.2-dev libfribidi-dev maxima maxima-share maxima-doc netcat-openbsd ninja-build pandoc at-spi2-core po4a
      - name: configure
        run: |
             export CXXFLAGS="-Wall -Wextra -ansi -Werror"
             export LANG=en_US.UTF-8
             mkdir build
             touch build build/build.ninja
             cd build
             cmake -G "Ninja" -DCMAKE_BUILD_TYPE=Debug -DWXM_UNIT_TESTS=YES -DWXM_DISABLE_WEBVIEW=ON ..
             cd ..
      - name: compile
        run: |
             cd build
             cmake --build .
             cd ..
      - name: update-locale
        run: |
             cd build
             cmake --build . --target update-locale
             cd ..

  compile_2204:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: write  # for softprops/action-gh-release to attach the .deb to a release

    steps:
      - name: Checkout_git
        uses: actions/checkout@v7
        with:
          # We must fetch at least the immediate parents so that if this is
          # a pull request then we can checkout the head.
          fetch-depth: 15
      - name: install_packages
        run: |
             sudo apt-get update
             sudo apt-get install cmake dpkg-dev gettext libwxgtk3.0-gtk3-dev libwxgtk-webview3.0-gtk3-dev libfribidi-dev pandoc make po4a
      - name: configure
        run: |
             export CXXFLAGS="-Wall -Wextra"
             export LANG=en_US.UTF-8
             mkdir build
             cd build
             cmake ..
             cd ..
      - name: compile
        run: |
             cd build
             cmake --build .
             cd ..
      - name: git-diff
        # run git diff to see, if the configure/build process has changed the source files (po4a can do that)
        run: git diff --compact-summary
      - name: cat_german_translation
        # output the german translation - how does it look like on Ubuntu 22.04?
        run: cat build/info/wxmaxima.de.md
      - name: Package .deb (release only)
        # See the matching step in compile_latest_and_test: a separate
        # Release-mode build dir, only on a release tag.
        if: startsWith(github.ref, 'refs/tags/Version')
        run: |
             mkdir build-release
             cd build-release
             cmake -DCMAKE_BUILD_TYPE=Release ..
             cmake --build .
             cpack -G DEB -B _CPack_DEB
             mv _CPack_DEB/*.deb wxmaxima-ubuntu-22.04-amd64.deb
             cd ..
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/Version')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          files: build-release/*.deb
          draft: false
          prerelease: false


