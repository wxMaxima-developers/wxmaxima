<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="560" viewBox="0 0 820 560">
  <style>
    .title { font-family: sans-serif; font-size: 16px; font-weight: bold; fill: #2c3e50; }
    .label { font-family: sans-serif; font-size: 12px; fill: #7f8c8d; }
    .note { font-family: sans-serif; font-size: 12px; fill: #2c3e50; }
    .entry { font-family: serif; font-size: 16px; fill: #2c3e50; }
    .caption { font-family: sans-serif; font-size: 13px; fill: #2c3e50; }
    .bracket { stroke: #2c3e50; stroke-width: 1.5; fill: none; }
    .page { stroke: #2980b9; stroke-width: 1.5; stroke-dasharray: 6,3; fill: none; }
    .pagetext { font-family: sans-serif; font-size: 11px; fill: #2980b9; }
    .cand { stroke: #e74c3c; stroke-width: 1; stroke-dasharray: 2,2; }
    .dimtext { font-family: sans-serif; font-size: 11px; fill: #e74c3c; }
  </style>

  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="20" y="28" class="title">MatrCell laid out for paper (printing, PDF export; OversizedMatrices::showInFull)</text>

  <!-- The label lines up with the first row: m_center reaches from the top
       of the first block's caption to the middle of row 0. -->
  <text x="30" y="98" class="label">(%o1)</text>

  <g transform="translate(90, 50)">
    <!-- Block 0: caption, then the box of columns 1..4 with all rows -->
    <text x="5" y="20" class="caption">Columns 1 to 4</text>
    <path class="bracket" d="M 6,30 Q 0,90 6,150" />
    <path class="bracket" d="M 234,30 Q 240,90 234,150" />
    <text x="20" y="52" class="entry">a₁₁    a₁₂    a₁₃    a₁₄</text>
    <text x="20" y="82" class="entry">a₂₁    a₂₂    a₂₃    a₂₄</text>
    <text x="20" y="112" class="entry">a₃₁    a₃₂    a₃₃    a₃₄</text>
    <text x="20" y="142" class="entry">a₄₁    a₄₂    a₄₃    a₄₄</text>
    <!-- PageBreakCandidates(): halfway between two rows -->
    <line x1="-10" y1="60" x2="250" y2="60" class="cand" />
    <line x1="-10" y1="90" x2="250" y2="90" class="cand" />
    <line x1="-10" y1="120" x2="250" y2="120" class="cand" />
    <text x="260" y="64" class="dimtext">page may start between two rows</text>

    <!-- Gap PaperBlockGap(), then block 1 -->
    <line x1="-10" y1="160" x2="250" y2="160" class="cand" />
    <text x="260" y="164" class="dimtext">... and before a block's caption, which stays with its first row</text>
    <text x="5" y="180" class="caption">Columns 5 to 7</text>

    <!-- A page break between row 2 and row 3 of block 1: the brackets are
         closed at the bottom of one page and opened again on the next. -->
    <path class="bracket" d="M 6,190 Q 0,220 6,250" />
    <path class="bracket" d="M 179,190 Q 185,220 179,250" />
    <text x="20" y="212" class="entry">a₁₅    a₁₆    a₁₇</text>
    <text x="20" y="242" class="entry">a₂₅    a₂₆    a₂₇</text>

    <rect x="-40" y="-20" width="660" height="275" class="page" />
    <text x="500" y="248" class="pagetext">end of page n</text>
    <rect x="-40" y="280" width="660" height="150" class="page" />
    <text x="500" y="298" class="pagetext">page n+1</text>

    <path class="bracket" d="M 6,282 Q 0,312 6,342" />
    <path class="bracket" d="M 179,282 Q 185,312 179,342" />
    <text x="20" y="304" class="entry">a₃₅    a₃₆    a₃₇</text>
    <text x="20" y="334" class="entry">a₄₅    a₄₆    a₄₇</text>
  </g>

  <text x="20" y="500" class="note">Too wide: entries shrink to fit the page, down to MinPaperScale (60%); wider still, the columns are split into</text>
  <text x="20" y="518" class="note">PaperBlocks at full size. Too tall: one block of all columns, without a caption. Draw() draws only the rows whose</text>
  <text x="20" y="536" class="note">middle lies on Configuration::GetPrintedPage(), with brackets around just them.</text>
</svg>
